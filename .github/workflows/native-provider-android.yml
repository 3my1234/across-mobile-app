name: Native provider Android compile
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-provider-android.yml'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_NATIVE_PROVIDER_ACCOUNT: 'true'
      # Compile artifact only: cannot reach live accounts or payment services.
      # A separately reviewed staging-target build is required for device journeys.
      EXPO_PUBLIC_API_URL: https://provider-build-check.invalid
      CI: '1'
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:provider-native
      - name: Generate native Android project from candidate configuration
        run: npx expo prebuild --platform android --no-install
      - name: Build bundled ARM64 APK using generated test signing
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g'
      - name: Label compile artifact and calculate checksum
        run: |
          mkdir -p provider-android-evidence
          cp android/app/build/outputs/apk/release/app-release.apk provider-android-evidence/provider-compile-only-arm64.apk
          cp android/app/build/outputs/bundle/release/app-release.aab provider-android-evidence/provider-compile-only-arm64.aab
          sha256sum provider-android-evidence/provider-compile-only-arm64.apk > provider-android-evidence/SHA256SUMS
          printf '%s\n' 'Compile-only artifact, generated test signing, non-production API endpoint. Not a production release or an integrated staging/device acceptance result.' > provider-android-evidence/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: provider-android-compile-only
          path: provider-android-evidence/
          retention-days: 3
